databaseChangeLog:
  - changeSet:
      id: 001-h2-schema
      author: spring-petclinic
      dbms: h2
      changes:
        - sqlFile:
            path: ../h2/schema.sql
            relativeToChangelogFile: true
            encoding: UTF-8
            splitStatements: true
            stripComments: true

  - changeSet:
      id: 002-h2-data
