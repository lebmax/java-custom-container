apiVersion: v1
kind: Pod
metadata:
  name: petclinic-native-diag
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
  initContainers:
    - name: prepare-tools
      image: container-registry.oracle.com/graalvm/native-image:25.0.5
      imagePullPolicy: IfNotPresent
      command: ["/bin/sh", "-ec"]
      args:
        - |
          "$JAVA_HOME/bin/jlink" \
            --add-modules jdk.jcmd,jdk.jfr \
            --strip-debug --no-man-pages --no-header-files \
            --output /tools/jdk
      volumeMounts:
        - {name: tools, mountPath: /tools}
  containers:
    - name: petclinic
      image: spring-petclinic:native-diag-2505
      imagePullPolicy: IfNotPresent
      resources:
        requests:
          cpu: 250m
          memory: 300Mi
        limits:
          cpu: "1"
          memory: 768Mi
      readinessProbe:
        httpGet:
          path: /actuator/health
          port: 8080
        periodSeconds: 2
      volumeMounts:
        - name: tools
          mountPath: /diagnostic-jdk
          subPath: jdk
          readOnly: true
        - {name: recordings, mountPath: /diagnostics}
  volumes:
    - {name: tools, emptyDir: {}}
    - {name: recordings, emptyDir: {}}
