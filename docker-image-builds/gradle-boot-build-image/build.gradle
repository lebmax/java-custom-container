plugins {
  id 'java'
  id 'org.springframework.boot' version '4.0.6'
  id 'io.spring.dependency-management' version '1.1.7'
}

group = 'org.springframework.samples'
version = '4.0.0-SNAPSHOT'

java {
  sourceCompatibility = JavaVersion.VERSION_21
  targetCompatibility = JavaVersion.VERSION_21
}

repositories {
  mavenCentral()
}

ext.webjarsLocatorLiteVersion = '1.1.3'
ext.webjarsFontawesomeVersion = '4.7.0'
ext.webjarsBootstrapVersion = '5.3.8'

sourceSets {
  main {
    java {
      srcDirs = ['../../src/main/java']
    }
    resources {
      srcDirs = ['../../src/main/resources']
    }
  }
  test {
    java {
      srcDirs = []
    }
    resources {
      srcDirs = []
    }
  }
}

dependencies {
  implementation 'org.springframework.boot:spring-boot-starter-actuator'
  implementation 'org.springframework.boot:spring-boot-starter-cache'
  implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
  implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
  implementation 'org.springframework.boot:spring-boot-starter-validation'
  implementation 'org.springframework.boot:spring-boot-starter-webmvc'
  implementation 'javax.cache:cache-api'
  implementation 'jakarta.xml.bind:jakarta.xml.bind-api'
  runtimeOnly 'com.github.ben-manes.caffeine:caffeine'
  runtimeOnly 'com.h2database:h2'
  runtimeOnly 'com.mysql:mysql-connector-j'
  runtimeOnly 'org.postgresql:postgresql:42.7.11'
  runtimeOnly "org.webjars:webjars-locator-lite:${webjarsLocatorLiteVersion}"
  runtimeOnly "org.webjars.npm:bootstrap:${webjarsBootstrapVersion}"
  runtimeOnly "org.webjars.npm:font-awesome:${webjarsFontawesomeVersion}"
  developmentOnly 'org.springframework.boot:spring-boot-devtools'
}

tasks.named('bootJar') {
  archiveFileName = 'app.jar'
}

tasks.named('bootBuildImage') {
  imageName = 'spring-petclinic:buildpack-gradle'
  builder = 'paketobuildpacks/builder-noble-java-tiny:latest'
  pullPolicy = 'IF_NOT_PRESENT'
  environment = [
    'BP_JVM_VERSION': '25'
  ]
  buildCache {
    volume {
      name = 'petclinic-gradle-build-cache'
    }
  }
  launchCache {
    volume {
      name = 'petclinic-gradle-launch-cache'
    }
  }
}
